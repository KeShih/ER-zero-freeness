name = "ERZeroFreeness"
version = "0.1.0"
defaultTargets = ["EndStatement", "ERZeroFreeness", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

# Trusted: the main claims, with every definition that they use.  One file beside this one, which
# imports Mathlib alone.
[[lean_lib]]
name = "EndStatement"

# Untrusted: the proofs.
[[lean_lib]]
name = "ERZeroFreeness"
globs = ["ERZeroFreeness", "ERZeroFreeness.+"]

# Trusted: the statements, each with sorry in place of its proof.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge.+"]

# Untrusted: for each file of statements, a file of the same name that imports the proofs.
[[lean_lib]]
name = "Solution"
globs = ["Solution.+"]
